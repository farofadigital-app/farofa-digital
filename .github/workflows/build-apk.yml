name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "minha-atualizacao" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Gerar arquivos nativos do Android
        run: npx expo prebuild --platform android --clean

      - name: Dar permissao ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: FarofaDigital-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7