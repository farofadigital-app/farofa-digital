name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "minha-atualizacao" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Incrementar versionCode automaticamente para sobreposicao no Android
        run: |
          BUILD_NUM=${{ github.run_number }}
          CODE=$(( 1000 + BUILD_NUM ))
          echo "Injetando versionCode: $CODE no app.json"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = $CODE;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2), 'utf8');
          "

      - name: Gerar arquivos nativos do Android
        run: npx expo prebuild --platform android --clean

      - name: Dar permissao ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de Debug
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: FarofaDigital-APK-Jogo
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
