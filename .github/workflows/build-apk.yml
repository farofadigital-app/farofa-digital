name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "minha-atualizacao" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Executar testes de regressao e layout
        run: npm test

      - name: Incrementar versao visivel e versionCode automaticamente
        id: version_code
        run: |
          BUILD_NUM=${{ github.run_number }}
          CODE=$(( 1000 + BUILD_NUM ))
          echo "Processando Build #$BUILD_NUM..."
          node -e "
            const fs = require('fs');
            
            // Atualiza app.json
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const currentVer = app.expo.version || '3.14.0';
            const parts = currentVer.split('.');
            const major = parts[0] || '3';
            const minor = parts[1] || '14';
            const novaVersao = major + '.' + minor + '.' + $BUILD_NUM;
            
            app.expo.version = novaVersao;
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = $CODE;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2), 'utf8');
            
            // Atualiza package.json
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = novaVersao;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2), 'utf8');
            } catch (e) {}

            console.log('Versao visivel definida para:', novaVersao);
            console.log('versionCode definido para:', $CODE);
          "
          echo "novo_code=$CODE" >> $GITHUB_OUTPUT

      - name: Gerar arquivos nativos do Android
        run: npx expo prebuild --platform android --clean

      - name: Dar permissao ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Validar versionCode do APK gerado contra versao anterior
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERRO FATAL: Nenhum APK foi encontrado em outputs/apk/release!"
            exit 1
          fi

          echo "APK compilado encontrado: $APK_FILE"

          # Localiza aapt nas ferramentas do Android SDK
          AAPT_BIN=$(which aapt || find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          
          if [ -n "$AAPT_BIN" ]; then
            APK_CODE=$($AAPT_BIN dump badging "$APK_FILE" | grep -o "versionCode='[0-9]*'" | cut -d"'" -f2)
            echo "versionCode verificado no APK nativo: $APK_CODE"
          else
            APK_CODE=${{ steps.version_code.outputs.novo_code }}
            echo "aapt nao localizado no PATH, usando codigo injetado no build: $APK_CODE"
          fi

          # Obtem o versionCode anterior registrado no git
          PREV_CODE=$(git show HEAD~1:app.json 2>/dev/null | node -e "
            try {
              const fs = require('fs');
              const prev = JSON.parse(fs.readFileSync(0, 'utf8'));
              console.log(prev.expo?.android?.versionCode || 1000);
            } catch (e) {
              console.log(1000);
            }
          " || echo 1000)

          echo "versionCode anterior de referencia: $PREV_CODE"

          if [ "$APK_CODE" -le "$PREV_CODE" ]; then
            echo "============================================================"
            echo "ERRO CRITICO: versionCode do APK ($APK_CODE) nao e maior que a versao anterior ($PREV_CODE)!"
            echo "Isso impediria a instalacao por cima no celular Android."
            echo "Interrompendo o build da Actions agora."
            echo "============================================================"
            exit 1
          fi

          echo "SUCESSO: versionCode $APK_CODE e maior que $PREV_CODE. Instalacao por cima garantida!"

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: FarofaDigital-APK-Jogo
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7