name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar o build manualmente pelo site

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias do projeto
        run: npm install --legacy-peer-deps

      - name: Gerar estrutura nativa do Android
        run: npx expo prebuild --platform android

      - name: Dar permissao de execucao ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar o APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: farofa-digital-apk
          path: android/app/build/outputs/apk/release/*.apk